services:
  # Decides what plays next (daypart mood + AudioMuse-AI sonic bridging) and
  # pushes tracks one at a time onto Liquidsoap's request.queue over telnet.
  # Needs AudioMuse-AI's Postgres for mood data, hence the second network.
  dj:
    build: ./dj
    image: jellyfin-radio-dj
    container_name: radio-dj
    restart: unless-stopped
    env_file:
      - .env
    environment:
      LIQUIDSOAP_HOST: liquidsoap
      # Without this the container defaults to UTC, so dj/schedule.json's
      # hour ranges (meant as local time) fire 1-2h late depending on DST.
      TZ: Europe/Berlin
    volumes:
      - ./dj/schedule.json:/dj/schedule.json:ro
      - dj_state:/state
    ports:
      # Loopback-only status/override API -- the host's Caddy proxies /dj/*
      # from here, same pattern as icecast's admin port below.
      - "127.0.0.1:9091:${DJ_STATUS_PORT:-9090}"
    networks:
      - default
      - audiomuse_default
    depends_on:
      - liquidsoap

  # Turns the DJ's queue (or a live DJ over harbor) into a continuous stream.
  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: radio-liquidsoap
    restart: unless-stopped
    command: ["liquidsoap", "/etc/liquidsoap/radio.liq"]
    env_file:
      - .env
    volumes:
      - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ./jingles:/jingles:ro
    ports:
      # Live DJ input (butt, Mixxx, …). Loopback-only by default — this host
      # has no firewall in front of it, and the Icecast source protocol sends
      # its password in the clear. Widen this (or tunnel in over SSH) only
      # when you're actually about to broadcast live.
      - "127.0.0.1:${RADIO_HARBOR_PORT:-8005}:${RADIO_HARBOR_PORT:-8005}"
      # NOT the telnet control port (1234) — that stays internal to the
      # compose network, reachable only by the dj service, never the host.
    depends_on:
      icecast:
        condition: service_started

  # The actual streaming server. Only Caddy and an SSH tunnel can reach it —
  # the admin UI at http://127.0.0.1:8000/admin/ is deliberately not public.
  icecast:
    build: ./icecast
    image: jellyfin-radio-icecast
    container_name: radio-icecast
    restart: unless-stopped
    env_file:
      - .env
    # Host port picked to avoid this box's existing services on 8000; the
    # container itself still listens on 8000 internally.
    ports:
      - "127.0.0.1:8010:8000"

  # TLS termination, the web player, and a proxy for the stream + status JSON.
  # Disabled here: this host already runs a system-level Caddy (for the other
  # creamfresh.xyz subdomains) bound to 80/443. That instance proxies to
  # icecast directly instead — see /etc/caddy/Caddyfile on the host.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: radio-caddy
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - ./web:/srv/web:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - icecast

volumes:
  dj_state:

networks:
  default:
  # AudioMuse-AI's own compose project network — already running on this
  # host (docker network ls shows it as "audiomuse_default"), and where its
  # Postgres container is reachable by the DNS name "postgres". Not created
  # here on purpose: docker compose fails fast if it's missing rather than
  # silently standing up an empty, wrong network of the same name.
  audiomuse_default:
    external: true
