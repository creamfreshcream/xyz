services:
  # Rewrites /playlists/radio.m3u from the Jellyfin library every RADIO_REFRESH_INTERVAL.
  playlist-sync:
    build: ./playlist_sync
    image: jellyfin-radio-playlist-sync
    container_name: radio-playlist-sync
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - playlists:/playlists
    healthcheck:
      test: ["CMD-SHELL", "test -s /playlists/radio.m3u"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Turns that playlist (or a live DJ) into a continuous stream.
  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: radio-liquidsoap
    restart: unless-stopped
    command: ["liquidsoap", "/etc/liquidsoap/radio.liq"]
    env_file:
      - .env
    volumes:
      - ./liquidsoap/radio.liq:/etc/liquidsoap/radio.liq:ro
      - ./jingles:/jingles:ro
      - playlists:/playlists:ro
    ports:
      # Live DJ input (butt, Mixxx, …). Loopback-only by default — this host
      # has no firewall in front of it, and the Icecast source protocol sends
      # its password in the clear. Widen this (or tunnel in over SSH) only
      # when you're actually about to broadcast live.
      - "127.0.0.1:${RADIO_HARBOR_PORT:-8005}:${RADIO_HARBOR_PORT:-8005}"
    depends_on:
      icecast:
        condition: service_started
      playlist-sync:
        condition: service_healthy

  # The actual streaming server. Only Caddy and an SSH tunnel can reach it —
  # the admin UI at http://127.0.0.1:8000/admin/ is deliberately not public.
  icecast:
    build: ./icecast
    image: jellyfin-radio-icecast
    container_name: radio-icecast
    restart: unless-stopped
    env_file:
      - .env
    # Host port picked to avoid this box's existing services on 8000; the
    # container itself still listens on 8000 internally.
    ports:
      - "127.0.0.1:8010:8000"

  # TLS termination, the web player, and a proxy for the stream + status JSON.
  # Disabled here: this host already runs a system-level Caddy (for the other
  # creamfresh.xyz subdomains) bound to 80/443. That instance proxies to
  # icecast directly instead — see /etc/caddy/Caddyfile on the host.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: radio-caddy
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "443:443/udp"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - ./web:/srv/web:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - icecast

volumes:
  playlists:
