<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio</title>
<meta name="description" content="Live internet radio">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14181d;
    --line: #232a32;
    --text: #e9edf2;
    --muted: #8b97a6;
    --accent: #f2624b;
    --accent-soft: rgba(242, 98, 75, 0.14);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: radial-gradient(1200px 600px at 50% -10%, #1a2029 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: min(440px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
  }

  .station {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 26px;
  }

  .station h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .station p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    border-radius: 999px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .badge.offline { background: rgba(139, 151, 166, 0.12); color: var(--muted); }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: currentColor;
  }

  .badge:not(.offline) .dot { animation: pulse 2s ease-in-out infinite; }

  @keyframes pulse { 50% { opacity: 0.25; } }

  .now {
    min-height: 74px;
    margin-bottom: 24px;
  }

  .now .label {
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .now .title {
    margin-top: 8px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.015em;
    overflow-wrap: anywhere;
  }

  .now .artist {
    margin-top: 3px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  button.play {
    flex: none;
    width: 58px;
    height: 58px;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: transform 0.12s ease, filter 0.12s ease;
  }

  button.play:hover { filter: brightness(1.08); }
  button.play:active { transform: scale(0.94); }
  button.play:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  button.play svg { width: 22px; height: 22px; fill: currentColor; }

  .volume { flex: 1; display: flex; align-items: center; gap: 10px; color: var(--muted); }

  .vote { flex: none; display: flex; gap: 6px; }

  .vote-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
  }

  .vote-btn svg { fill: currentColor; }
  .vote-btn:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
  .vote-btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .vote-btn:disabled { opacity: 0.35; cursor: default; }
  .vote-btn.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }

  input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
    background: transparent;
  }

  .meta {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--muted);
  }

  .drift {
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .drift[hidden] { display: none; }
  .drift b { color: var(--text); font-weight: 500; }

  .history { margin-top: 18px; }
  .history .label { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .history ol { margin: 10px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
  .history li { padding: 4px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history:empty, .history[hidden] { display: none; }

  .songmap { margin-top: 18px; }
  .songmap .label { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
  .songmap[hidden] { display: none; }

  .songmap-frame {
    position: relative;
    margin-top: 10px;
    border-radius: 10px;
    overflow: hidden;
    background: #05070a;
    aspect-ratio: 900 / 680;
  }

  .songmap-bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .songmap-trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .songmap-trail line { stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
  .songmap-trail circle { fill: var(--accent); }

  .songmap-dot {
    position: absolute;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 0 10px 2px rgba(242, 98, 75, 0.7);
    transition: left 0.6s ease, top 0.6s ease;
  }

  a { color: inherit; }
</style>
</head>
<body>
<main class="card">
  <div class="station">
    <div>
      <h1 id="station-name">Radio</h1>
      <p id="station-description"></p>
    </div>
    <span class="badge offline" id="status"><span class="dot"></span><span id="status-text">Offline</span></span>
  </div>

  <div class="now">
    <div class="label">Now playing</div>
    <div class="title" id="title">—</div>
    <div class="artist" id="artist"></div>
    <div class="drift" id="drift" hidden></div>
  </div>

  <div class="controls">
    <button class="play" id="play" type="button" aria-label="Play">
      <svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="volume">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/>
      </svg>
      <input type="range" id="volume" min="0" max="100" value="40" aria-label="Volume">
    </div>
    <div class="vote">
      <button class="vote-btn" id="vote-up" type="button" aria-label="Like this track" title="Gefällt mir" disabled>
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path d="M2 21h2a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1H2v11zM22 11.5a2 2 0 0 0-2-2h-5.7l.86-4.14.03-.32c0-.4-.16-.77-.42-1.03L14.17 3 7.6 9.57C7.22 9.94 7 10.46 7 11v8a2 2 0 0 0 2 2h8.5c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.1-.24.14-.5.14-.77v-1.4l-.01-.01L22 11.5z"/>
        </svg>
      </button>
      <button class="vote-btn" id="vote-down" type="button" aria-label="Dislike this track" title="Gefällt mir nicht" disabled>
        <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
          <path d="M22 3h-2a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h2V3zM2 12.5a2 2 0 0 0 2 2h5.7l-.86 4.14-.03.32c0 .4.16.77.42 1.03L9.83 21l6.57-6.57c.38-.37.6-.89.6-1.43V5a2 2 0 0 0-2-2H6.5c-.83 0-1.54.5-1.84 1.22L1.64 11.27c-.1.24-.14.5-.14.77v1.4l.01.01L2 12.5z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="meta">
    <span id="listeners">— listeners</span>
    <span id="likes-today" hidden></span>
    <span id="quality"></span>
  </div>

  <div class="history" id="history" hidden>
    <div class="label">Recently played</div>
    <ol id="history-list"></ol>
  </div>

  <div class="songmap" id="songmap" hidden>
    <div class="label">On the sonic map</div>
    <div class="songmap-frame">
      <img src="/song_map.png" alt="" class="songmap-bg">
      <svg class="songmap-trail" id="songmap-trail" viewBox="0 0 900 680"></svg>
      <div class="songmap-dot" id="songmap-dot"></div>
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";

  const STATUS_URL = "/status-json.xsl";
  const DJ_STATUS_URL = "/dj/status";
  const FALLBACK_MOUNT = "/stream.mp3";
  const POLL_MS = 10000;
  const DJ_POLL_MS = 30000; // the target changes over minutes, not seconds
  const HISTORY_LENGTH = 5;

  const audio = new Audio();
  audio.preload = "none";
  audio.crossOrigin = "anonymous";

  // If the page itself was opened as https://user:pass@host/..., a plain
  // relative fetch("/status-json.xsl") resolves against that and inherits
  // the embedded credentials -- which fetch() then refuses outright
  // ("... is an url with embedded credentials"), never even hitting the
  // network. Building an explicit same-origin URL with the userinfo
  // stripped avoids that; the browser still attaches its cached HTTP-auth
  // credentials for the realm on its own, same as any other same-origin request.
  function credentiallessUrl(path) {
    const url = new URL(path, location.href);
    url.username = "";
    url.password = "";
    return url.toString();
  }

  const el = (id) => document.getElementById(id);
  const history = [];
  let mount = FALLBACK_MOUNT;
  let lastTrack = "";

  // A synchronous throw here (storage blocked entirely -- strict privacy
  // settings, some private-browsing configurations) would otherwise kill
  // this whole script before poll() ever gets called, leaving the page
  // stuck on its static "Offline" markup with no request ever firing.
  let savedVolume = NaN;
  try { savedVolume = Number(localStorage.getItem("radio:volume")); } catch (_) {}
  const volume = Number.isFinite(savedVolume) && savedVolume > 0 ? savedVolume : 40;
  el("volume").value = volume;
  audio.volume = volume / 100;

  el("volume").addEventListener("input", (event) => {
    audio.volume = event.target.value / 100;
    try { localStorage.setItem("radio:volume", event.target.value); } catch (_) {}
  });

  el("play").addEventListener("click", () => {
    if (audio.paused) {
      // Re-point at the mount every time: a live stream cannot be resumed, and a
      // stale URL would replay whatever was buffered minutes ago.
      audio.src = mount + (mount.includes("?") ? "&" : "?") + "t=" + Date.now();
      audio.play().catch(() => setPlaying(false));
      setPlaying(true);
    } else {
      audio.pause();
      audio.removeAttribute("src");
      audio.load();
      setPlaying(false);
    }
  });

  audio.addEventListener("playing", () => setPlaying(true));
  audio.addEventListener("pause", () => setPlaying(false));
  audio.addEventListener("error", () => setPlaying(false));

  function setPlaying(playing) {
    el("icon").innerHTML = playing
      ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
      : '<path d="M8 5v14l11-7z"/>';
    el("play").setAttribute("aria-label", playing ? "Pause" : "Play");
  }

  function sources(stats) {
    const source = stats && stats.source;
    if (!source) return [];
    return Array.isArray(source) ? source : [source];
  }

  function pickSource(list) {
    // Prefer the mount we are already playing, otherwise take the first one and
    // adopt it — that way renaming RADIO_MOUNT needs no change in here.
    const match = list.find((s) => String(s.listenurl || "").endsWith(mount));
    return match || list[0] || null;
  }

  // Icecast's status-json.xsl HTML-entity-escapes metadata (a leftover from
  // its XSLT origins) even though the endpoint is JSON — "–" arrives as
  // "&#8211;". Decode via a detached textarea: the browser's own parser
  // does the work, and textarea content is never executed as markup.
  const entityDecoder = document.createElement("textarea");
  function decodeEntities(text) {
    entityDecoder.innerHTML = text;
    return entityDecoder.value;
  }

  function splitTitle(source) {
    const artist = decodeEntities(source.artist || "");
    const title = decodeEntities(source.title || source.yp_currently_playing || "");
    if (artist) return { artist, title };
    const parts = title.split(" - ");
    return parts.length > 1
      ? { artist: parts.shift().trim(), title: parts.join(" - ").trim() }
      : { artist: "", title: title.trim() };
  }

  function remember(track) {
    if (!track || track === lastTrack) return;
    if (lastTrack) history.unshift(lastTrack);
    lastTrack = track;
    resetVoteButtons();
    history.splice(HISTORY_LENGTH);
    el("history").hidden = history.length === 0;
    el("history-list").replaceChildren(
      ...history.map((entry) => {
        const li = document.createElement("li");
        li.textContent = entry;
        return li;
      })
    );
  }

  function setOffline() {
    el("status").classList.add("offline");
    el("status-text").textContent = "Offline";
    el("title").textContent = "Off air";
    el("artist").textContent = "";
    el("listeners").textContent = "— listeners";
    el("quality").textContent = "";
    el("drift").hidden = true;
    el("vote-up").disabled = true;
    el("vote-down").disabled = true;
  }

  function resetVoteButtons() {
    el("vote-up").disabled = false;
    el("vote-down").disabled = false;
    el("vote-up").classList.remove("active");
    el("vote-down").classList.remove("active");
  }

  async function vote(direction) {
    const upBtn = el("vote-up");
    const downBtn = el("vote-down");
    upBtn.disabled = true;
    downBtn.disabled = true;
    try {
      const response = await fetch(credentiallessUrl("/dj/feedback"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ vote: direction }),
      });
      if (!response.ok) throw new Error(`feedback returned ${response.status}`);
      upBtn.classList.toggle("active", direction === "up");
      downBtn.classList.toggle("active", direction === "down");
    } catch (err) {
      console.error("radio: vote failed", err);
    } finally {
      upBtn.disabled = false;
      downBtn.disabled = false;
    }
  }

  el("vote-up").addEventListener("click", () => vote("up"));
  el("vote-down").addEventListener("click", () => vote("down"));

  async function poll() {
    try {
      const response = await fetch(credentiallessUrl(STATUS_URL), { cache: "no-store" });
      if (!response.ok) console.error("radio: status fetch returned", response.status);
      const source = pickSource(sources((await response.json()).icestats));
      if (!source) return setOffline();

      if (source.listenurl) {
        try { mount = new URL(source.listenurl).pathname; } catch (_) {}
      }

      const { artist, title } = splitTitle(source);
      const name = decodeEntities(source.server_name || "Radio");
      document.title = title ? `${title} · ${name}` : name;
      el("station-name").textContent = name;
      el("station-description").textContent = decodeEntities(source.server_description || "");
      el("title").textContent = title || "—";
      el("artist").textContent = artist;

      const listeners = Number(source.listeners || 0);
      el("listeners").textContent = `${listeners} listener${listeners === 1 ? "" : "s"}`;
      el("quality").textContent = [
        source.bitrate ? `${source.bitrate} kbps` : "",
        source.genre || "",
      ].filter(Boolean).join(" · ");

      el("status").classList.remove("offline");
      el("status-text").textContent = "On air";
      remember([artist, title].filter(Boolean).join(" — "));
    } catch (err) {
      console.error("radio: poll() failed", err);
      setOffline();
    }
  }

  // The DJ isn't guaranteed to be deployed (or reachable, mid-transition) —
  // failures here just leave the line hidden rather than affecting playback.
  async function pollDj() {
    try {
      const response = await fetch(credentiallessUrl(DJ_STATUS_URL), { cache: "no-store" });
      if (!response.ok) return;
      const status = await response.json();

      const likesEl = el("likes-today");
      const likes = Number(status.likes_today || 0);
      likesEl.hidden = likes === 0;
      likesEl.textContent = `♥ ${likes} today`;

      const songmap = el("songmap");
      const trailSvg = el("songmap-trail");
      const pos = status.map_position;
      if (pos && pos.bounds) {
        const { bounds } = pos;
        const toPct = (x, y) => ({
          px: ((x - bounds.xmin) / (bounds.xmax - bounds.xmin)) * 100,
          py: (1 - (y - bounds.ymin) / (bounds.ymax - bounds.ymin)) * 100,
        });
        const here = toPct(pos.x, pos.y);
        el("songmap-dot").style.left = `${here.px}%`;
        el("songmap-dot").style.top = `${here.py}%`;
        songmap.hidden = false;

        // Fading trail of recently played tracks, oldest to newest, ending
        // at the current position -- older points/segments are more faded.
        const trail = (status.map_trail || []).map((p) => toPct(p.x, p.y));
        const n = trail.length;
        const frac = (i) => (n > 1 ? i / (n - 1) : 1);
        let svg = "";
        for (let i = 0; i < n - 1; i++) {
          const a = trail[i], b = trail[i + 1];
          const opacity = 0.08 + 0.55 * frac(i + 1);
          svg += `<line x1="${(a.px * 9).toFixed(1)}" y1="${(a.py * 6.8).toFixed(1)}" x2="${(b.px * 9).toFixed(1)}" y2="${(b.py * 6.8).toFixed(1)}" stroke-opacity="${opacity.toFixed(2)}" />`;
        }
        for (let i = 0; i < n - 1; i++) {
          const p = trail[i];
          const opacity = 0.12 + 0.5 * frac(i);
          const r = 2.4 + 1.6 * frac(i);
          svg += `<circle cx="${(p.px * 9).toFixed(1)}" cy="${(p.py * 6.8).toFixed(1)}" r="${r.toFixed(1)}" opacity="${opacity.toFixed(2)}" />`;
        }
        trailSvg.innerHTML = svg;
      } else {
        songmap.hidden = true;
        trailSvg.innerHTML = "";
      }

      const target = status && status.target;
      const dj = el("drift");
      if (!target || !target.title) {
        dj.hidden = true;
        return;
      }
      const who = [target.author, target.title].filter(Boolean).join(" – ");
      const phase = status.phase === "dwelling" ? "settling into" : "drifting toward";
      const b = document.createElement("b");
      b.textContent = who;
      dj.replaceChildren(
        `${phase} `,
        b,
        status.daypart ? ` · ${status.daypart}` : ""
      );
      dj.hidden = false;
    } catch (_) {
      el("drift").hidden = true;
    }
  }

  poll();
  pollDj();
  setInterval(poll, POLL_MS);
  setInterval(pollDj, DJ_POLL_MS);
})();
</script>
</body>
</html>
