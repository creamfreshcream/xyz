[project]
name = "jellyfin-discord-music-bot"
version = "1.0.0"
description = "A Discord bot that streams music from your Jellyfin server"
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.4,<3",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
]

[project.scripts]
jellyfin-music-bot = "jellyfin_bot.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jellyfin_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
